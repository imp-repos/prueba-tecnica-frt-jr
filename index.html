<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaTech | Catálogo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Seguí el diseño de Figma para la estructura y el estilo. -->
  <!-- Podés cambiar y acomodar este HTML como lo necesites. -->
  <header>
    <h1>NovaTech</h1>

    <!-- Buscador -->
    <input id="buscador" type="text" placeholder="Buscar producto..." />

    <!-- Filtro por categoría (las demás opciones se agregan desde JavaScript) -->
    <select id="categoria">
      <option value="todas">Todas las categorías</option>
    </select>
  </header>

  <!-- Aquí se van a mostrar las tarjetas de productos -->
  <main id="catalogo"></main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
